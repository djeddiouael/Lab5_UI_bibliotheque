{% extends 'base.html' %} {% block content %}
<div class="auteurs-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <span class="header-badge">Gestion</span>
      <h1>Gestion des Auteurs</h1>
      <p>Ajoutez, modifiez et gérez tous les auteurs de votre bibliothèque</p>
    </div>
  </div>

  <div class="content-grid">
    <!-- Formulaire pour ajouter un nouvel auteur -->
    <div class="formulaire-card">
      <div class="card-header">
        <div class="header-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4V20M20 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h3>Ajouter un nouvel auteur</h3>
          <p>Remplissez tous les champs pour ajouter un auteur</p>
        </div>
      </div>

      <form id="form-auteur" class="formulaire-auteur">
        <div class="form-row">
          <div class="form-group">
            <label for="nom">
              <span>Nom</span>
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="nom"
              name="nom"
              required
              placeholder="Ex: Hugo"
              class="form-input"
            />
          </div>

          <div class="form-group">
            <label for="prenom">
              <span>Prénom</span>
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="prenom"
              name="prenom"
              required
              placeholder="Ex: Victor"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="nationalite">
              <span>Nationalité</span>
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="nationalite"
              name="nationalite"
              required
              placeholder="Ex: Française"
              class="form-input"
            />
          </div>

          <div class="form-group">
            <label for="date_naissance">
              <span>Date de naissance</span>
              <span class="required">*</span>
            </label>
            <input 
              type="date" 
              id="date_naissance" 
              name="date_naissance" 
              required 
              class="form-input"
            />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 14.66V20H4V4H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 2L22 6M12 12L22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Ajouter l'auteur</span>
        </button>
        
        <div id="message-form" class="message-toast"></div>
      </form>
    </div>

    <!-- Liste des auteurs -->
    <div class="liste-card">
      <div class="card-header">
        <div class="header-icon list-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="6" r="2" fill="currentColor"/>
            <circle cx="20" cy="12" r="2" fill="currentColor"/>
            <circle cx="20" cy="18" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h3>Liste des auteurs</h3>
          <p id="compteur-auteurs">Chargement...</p>
        </div>
      </div>

      <div id="liste-auteurs" class="liste-auteurs">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Chargement des auteurs...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* Variables globales */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --primary: #667eea;
  --primary-dark: #5a67d8;
  --secondary: #764ba2;
  --success: #48bb78;
  --danger: #f56565;
  --danger-dark: #e53e3e;
  --dark: #1a202c;
  --gray: #718096;
  --gray-light: #a0aec0;
  --light-bg: #f7fafc;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
  --shadow-xl: 0 20px 40px rgba(0,0,0,0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--dark);
  min-height: 100vh;
}

.auteurs-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 30px;
}

/* Page Header */
.page-header {
  text-align: center;
  margin-bottom: 50px;
}

.header-badge {
  display: inline-block;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
  padding: 8px 20px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.page-header h1 {
  font-size: 42px;
  font-weight: 800;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 15px;
}

.page-header p {
  color: var(--gray);
  font-size: 16px;
}

/* Content Grid */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 30px;
}

/* Cards */
.formulaire-card, .liste-card {
  background: white;
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.formulaire-card:hover, .liste-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-xl);
}

.card-header {
  padding: 30px 30px 20px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 15px;
}

.header-icon {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}

.list-icon {
  background: linear-gradient(135deg, rgba(72, 187, 120, 0.1), rgba(56, 161, 105, 0.1));
  color: var(--success);
}

.card-header h3 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 5px;
}

.card-header p {
  color: var(--gray);
  font-size: 14px;
  margin: 0;
}

/* Formulaire */
.formulaire-auteur {
  padding: 30px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-weight: 600;
  font-size: 14px;
  color: var(--dark);
}

.required {
  color: var(--danger);
  margin-left: 4px;
}

.form-input {
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  transition: all 0.3s ease;
  outline: none;
  font-family: inherit;
}

.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-input:hover {
  border-color: var(--gray-light);
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: var(--primary-gradient);
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.btn-submit:active {
  transform: translateY(0);
}

/* Message Toast */
.message-toast {
  margin-top: 20px;
  padding: 12px 16px;
  border-radius: 12px;
  display: none;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    transform: translateY(-10px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.succes {
  background: #c6f6d5;
  color: #22543d;
  display: block;
  border-left: 4px solid var(--success);
}

.erreur {
  background: #fed7d7;
  color: #742a2a;
  display: block;
  border-left: 4px solid var(--danger);
}

/* Liste des auteurs */
.liste-auteurs {
  max-height: 600px;
  overflow-y: auto;
  padding: 0 30px 30px;
}

/* Scrollbar personnalisée */
.liste-auteurs::-webkit-scrollbar {
  width: 6px;
}

.liste-auteurs::-webkit-scrollbar-track {
  background: var(--light-bg);
  border-radius: 10px;
}

.liste-auteurs::-webkit-scrollbar-thumb {
  background: var(--gray-light);
  border-radius: 10px;
}

.liste-auteurs::-webkit-scrollbar-thumb:hover {
  background: var(--gray);
}

/* Auteur Card */
.auteur-card {
  background: var(--light-bg);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  transition: all 0.3s ease;
  border: 1px solid var(--border);
  animation: fadeInUp 0.4s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auteur-card:hover {
  transform: translateX(8px);
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.auteur-info {
  margin-bottom: 15px;
}

.auteur-nom {
  font-size: 18px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 10px;
}

.auteur-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  font-size: 13px;
  color: var(--gray);
}

.auteur-details p {
  display: flex;
  align-items: center;
  gap: 6px;
}

.auteur-details p strong {
  color: var(--dark);
  font-weight: 600;
}

.btn-supprimer {
  width: 100%;
  padding: 10px;
  background: white;
  color: var(--danger);
  border: 2px solid var(--danger);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
}

.btn-supprimer:hover {
  background: var(--danger);
  color: white;
  transform: translateY(-2px);
}

.btn-supprimer.deleting {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Loading States */
.loading-state {
  text-align: center;
  padding: 60px 20px;
}

.spinner {
  border: 3px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.message-vide {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray);
  font-size: 16px;
}

/* Responsive */
@media (max-width: 968px) {
  .content-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .page-header h1 {
    font-size: 32px;
  }

  .auteurs-container {
    padding: 20px;
  }
}

@media (max-width: 640px) {
  .form-row {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .card-header {
    padding: 20px;
    flex-direction: column;
    text-align: center;
  }

  .formulaire-auteur {
    padding: 20px;
  }

  .liste-auteurs {
    padding: 0 20px 20px;
  }

  .auteur-details {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .page-header h1 {
    font-size: 28px;
  }
}

/* Animation pour suppression */
@keyframes fadeOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(-20px);
  }
}

.auteur-card.deleting {
  animation: fadeOut 0.3s ease forwards;
}
</style>

<script>
  const API_BASE_URL = "/api/auteurs";

  // Fonction pour charger la liste des auteurs
  async function chargerAuteurs() {
    try {
      const response = await fetch(`${API_BASE_URL}/`);

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      const auteurs = await response.json();
      afficherAuteurs(auteurs);
      mettreAJourCompteur(auteurs.length);
    } catch (error) {
      console.error("Erreur lors du chargement des auteurs:", error);
      document.getElementById("liste-auteurs").innerHTML =
        '<div class="message-vide">⚠️ Erreur lors du chargement des auteurs. Vérifiez que l\'API est accessible.</div>';
      mettreAJourCompteur(0);
    }
  }

  // Fonction pour mettre à jour le compteur
  function mettreAJourCompteur(nombre) {
    const compteurElem = document.getElementById("compteur-auteurs");
    if (nombre === 1) {
      compteurElem.textContent = `${nombre} auteur trouvé`;
    } else {
      compteurElem.textContent = `${nombre} auteurs trouvés`;
    }
  }

  // Fonction pour afficher la liste des auteurs
  function afficherAuteurs(auteurs) {
    const container = document.getElementById("liste-auteurs");

    if (auteurs.length === 0) {
      container.innerHTML = '<div class="message-vide">📚 Aucun auteur pour le moment. Ajoutez votre premier auteur !</div>';
      return;
    }

    container.innerHTML = auteurs
      .map(
        (auteur) => `
          <div class="auteur-card" data-id="${auteur.id}">
            <div class="auteur-info">
              <div class="auteur-nom">${auteur.prenom} ${auteur.nom}</div>
              <div class="auteur-details">
                <p>🌍 <strong>Nationalité:</strong> ${auteur.nationalite || "N/A"}</p>
                <p>🎂 <strong>Date de naissance:</strong> ${auteur.date_naissance || "N/A"}</p>
              </div>
            </div>
            <div class="auteur-actions">
              <button class="btn-supprimer" onclick="supprimerAuteur(${auteur.id})">
                🗑️ Supprimer
              </button>
            </div>
          </div>
        `
      )
      .join("");
  }

  // Fonction pour ajouter un nouvel auteur
  async function ajouterAuteur(event) {
    event.preventDefault();

    const formData = new FormData(document.getElementById("form-auteur"));
    const messageDiv = document.getElementById("message-form");
    const submitBtn = document.querySelector(".btn-submit");

    const donnees = {
      nom: formData.get("nom"),
      prenom: formData.get("prenom"),
      nationalite: formData.get("nationalite"),
      date_naissance: formData.get("date_naissance"),
    };

    // Validation simple
    if (!donnees.nom || !donnees.prenom || !donnees.nationalite || !donnees.date_naissance) {
      messageDiv.textContent = "Veuillez remplir tous les champs obligatoires";
      messageDiv.className = "erreur";
      return;
    }

    try {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0"></div> Ajout en cours...';
      messageDiv.style.display = "block";
      messageDiv.className = "";
      messageDiv.textContent = "Ajout en cours...";

      const response = await fetch(`${API_BASE_URL}/creer/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken(),
        },
        body: JSON.stringify(donnees),
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || `Erreur HTTP: ${response.status}`);
      }

      document.getElementById("form-auteur").reset();

      messageDiv.textContent = "✓ Auteur ajouté avec succès!";
      messageDiv.className = "succes";

      setTimeout(() => {
        chargerAuteurs();
        setTimeout(() => {
          messageDiv.style.display = "none";
        }, 2000);
      }, 500);
    } catch (error) {
      console.error("Erreur lors de l'ajout:", error);
      messageDiv.textContent = `✗ Erreur: ${error.message}`;
      messageDiv.className = "erreur";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.66V20H4V4H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 2L22 6M12 12L22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Ajouter l'auteur</span>
      `;
    }
  }

  // Fonction pour supprimer un auteur
  async function supprimerAuteur(id) {
    if (!confirm("Êtes-vous sûr de vouloir supprimer cet auteur ?")) {
      return;
    }

    const card = document.querySelector(`[data-id="${id}"]`);
    const button = card.querySelector(".btn-supprimer");

    try {
      button.disabled = true;
      button.classList.add("deleting");
      button.textContent = "🗑️ Suppression...";

      const response = await fetch(`${API_BASE_URL}/${id}/supprimer/`, {
        method: "DELETE",
        headers: {
          "X-CSRFToken": getCSRFToken(),
        },
      });

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      card.classList.add("deleting");
      
      setTimeout(() => {
        chargerAuteurs();
      }, 300);
    } catch (error) {
      console.error("Erreur lors de la suppression:", error);
      alert(`Erreur lors de la suppression: ${error.message}`);
      button.disabled = false;
      button.classList.remove("deleting");
      button.textContent = "🗑️ Supprimer";
    }
  }

  // Fonction pour récupérer le token CSRF
  function getCSRFToken() {
    let csrfToken = null;
    const cookies = document.cookie.split(";");

    for (let cookie of cookies) {
      const [name, value] = cookie.trim().split("=");
      if (name === "csrftoken") {
        csrfToken = value;
        break;
      }
    }

    return csrfToken;
  }

  // Initialisation
  document.addEventListener("DOMContentLoaded", function () {
    chargerAuteurs();
    document.getElementById("form-auteur").addEventListener("submit", ajouterAuteur);
  });
</script>

{% endblock %}
