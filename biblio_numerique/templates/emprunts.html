{% extends 'base.html' %} {% block content %}
<div class="emprunts-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <span class="header-badge">Prêts & Retours</span>
      <h1>Gestion des Emprunts</h1>
      <p>Enregistrez, suivez et gérez tous les prêts de livres</p>
    </div>
  </div>

  <div class="content-grid">
    <!-- Formulaire pour enregistrer un nouvel emprunt -->
    <div class="formulaire-card">
      <div class="card-header">
        <div class="header-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12V8H4V12M20 12L4 12M20 12L18 20H6L4 12M12 16H14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h3>Nouvel emprunt</h3>
          <p>Enregistrez un nouveau prêt de livre</p>
        </div>
      </div>

      <form id="form-emprunt" class="formulaire-emprunt">
        <div class="form-group">
          <label for="nom_lecteur">
            <span>Nom du lecteur</span>
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="nom_lecteur"
            name="nom_lecteur"
            required
            placeholder="Ex: Jean Dupont"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="livre_id">
            <span>Livre à emprunter</span>
            <span class="required">*</span>
          </label>
          <select id="livre_id" name="livre_id" required class="form-select">
            <option value="">-- Sélectionnez un livre --</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date_emprunt">
              <span>Date d'emprunt</span>
              <span class="required">*</span>
            </label>
            <input type="date" id="date_emprunt" name="date_emprunt" required class="form-input" />
          </div>

          <div class="form-group">
            <label for="date_retour_input">
              <span>Date de retour prévue</span>
              <span class="optional">(Optionnel)</span>
            </label>
            <input type="date" id="date_retour_input" name="date_retour" class="form-input" />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 14.66V20H4V4H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 2L22 6M12 12L22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Enregistrer l'emprunt</span>
        </button>
        
        <div id="message-form" class="message-toast"></div>
      </form>
    </div>

    <!-- Liste des emprunts -->
    <div class="liste-card">
      <div class="card-header">
        <div class="header-icon list-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="6" r="2" fill="currentColor"/>
            <circle cx="20" cy="12" r="2" fill="currentColor"/>
            <circle cx="20" cy="18" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h3>Emprunts en cours</h3>
          <p id="compteur-emprunts">Chargement...</p>
        </div>
      </div>

      <div id="liste-emprunts" class="liste-emprunts">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Chargement des emprunts...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* Variables globales */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --primary: #667eea;
  --primary-dark: #5a67d8;
  --secondary: #764ba2;
  --warning: #f6ad55;
  --warning-dark: #ed8936;
  --success: #48bb78;
  --danger: #f56565;
  --danger-dark: #e53e3e;
  --info: #4299e1;
  --dark: #1a202c;
  --gray: #718096;
  --gray-light: #a0aec0;
  --light-bg: #f7fafc;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
  --shadow-xl: 0 20px 40px rgba(0,0,0,0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--dark);
  min-height: 100vh;
}

.emprunts-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 30px;
}

/* Page Header */
.page-header {
  text-align: center;
  margin-bottom: 50px;
}

.header-badge {
  display: inline-block;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
  padding: 8px 20px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.page-header h1 {
  font-size: 42px;
  font-weight: 800;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 15px;
}

.page-header p {
  color: var(--gray);
  font-size: 16px;
}

/* Content Grid */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 30px;
}

/* Cards */
.formulaire-card, .liste-card {
  background: white;
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.formulaire-card:hover, .liste-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-xl);
}

.card-header {
  padding: 30px 30px 20px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 15px;
}

.header-icon {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}

.list-icon {
  background: linear-gradient(135deg, rgba(72, 187, 120, 0.1), rgba(56, 161, 105, 0.1));
  color: var(--success);
}

.card-header h3 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 5px;
}

.card-header p {
  color: var(--gray);
  font-size: 14px;
  margin: 0;
}

/* Formulaire */
.formulaire-emprunt {
  padding: 30px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.form-group label {
  font-weight: 600;
  font-size: 14px;
  color: var(--dark);
}

.required {
  color: var(--danger);
  margin-left: 4px;
}

.optional {
  color: var(--gray);
  font-size: 11px;
  margin-left: 8px;
  font-weight: normal;
}

.form-input, .form-select {
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  transition: all 0.3s ease;
  outline: none;
  font-family: inherit;
  background: white;
}

.form-input:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-input:hover, .form-select:hover {
  border-color: var(--gray-light);
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: var(--primary-gradient);
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.btn-submit:active {
  transform: translateY(0);
}

/* Message Toast */
.message-toast {
  margin-top: 20px;
  padding: 12px 16px;
  border-radius: 12px;
  display: none;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    transform: translateY(-10px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.succes {
  background: #c6f6d5;
  color: #22543d;
  display: block;
  border-left: 4px solid var(--success);
}

.erreur {
  background: #fed7d7;
  color: #742a2a;
  display: block;
  border-left: 4px solid var(--danger);
}

/* Liste des emprunts */
.liste-emprunts {
  max-height: 600px;
  overflow-y: auto;
  padding: 0 30px 30px;
}

/* Scrollbar personnalisée */
.liste-emprunts::-webkit-scrollbar {
  width: 6px;
}

.liste-emprunts::-webkit-scrollbar-track {
  background: var(--light-bg);
  border-radius: 10px;
}

.liste-emprunts::-webkit-scrollbar-thumb {
  background: var(--gray-light);
  border-radius: 10px;
}

.liste-emprunts::-webkit-scrollbar-thumb:hover {
  background: var(--gray);
}

/* Emprunt Card */
.emprunt-card {
  background: var(--light-bg);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  transition: all 0.3s ease;
  border: 1px solid var(--border);
  animation: fadeInUp 0.4s ease;
  position: relative;
  overflow: hidden;
}

.emprunt-card.retourne {
  background: linear-gradient(135deg, #f0fff4 0%, #e6fffa 100%);
  border-color: var(--success);
  opacity: 0.85;
}

.emprunt-card.retourne::before {
  content: '✓';
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 24px;
  color: var(--success);
  opacity: 0.3;
}

.emprunt-card.retard {
  border-left: 4px solid var(--danger);
  background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.emprunt-card:hover {
  transform: translateX(8px);
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.emprunt-lecteur {
  font-size: 18px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.emprunt-livre {
  font-size: 15px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 12px;
}

.emprunt-details {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  font-size: 13px;
  color: var(--gray);
  margin-bottom: 15px;
}

.emprunt-details p {
  display: flex;
  align-items: center;
  gap: 6px;
}

.emprunt-details p strong {
  color: var(--dark);
  font-weight: 600;
}

.emprunt-statut {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.emprunt-statut.en-cours {
  background: #fff3cd;
  color: #856404;
}

.emprunt-statut.retourne {
  background: #d4edda;
  color: #155724;
}

.emprunt-statut.retard {
  background: #f8d7da;
  color: #721c24;
}

.emprunt-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.btn-retourner, .btn-supprimer {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
}

.btn-retourner {
  background: linear-gradient(135deg, var(--info), #3182ce);
  color: white;
}

.btn-retourner:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
}

.btn-supprimer {
  background: white;
  color: var(--danger);
  border: 2px solid var(--danger);
}

.btn-supprimer:hover:not(:disabled) {
  background: var(--danger);
  color: white;
  transform: translateY(-2px);
}

.btn-retourner:disabled, .btn-supprimer:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Loading States */
.loading-state {
  text-align: center;
  padding: 60px 20px;
}

.spinner {
  border: 3px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.message-vide {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray);
  font-size: 16px;
}

/* Stat Cards */
.stats-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--light-bg);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

.stat-number {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}

.stat-label {
  font-size: 12px;
  color: var(--gray);
  margin-top: 5px;
}

/* Responsive */
@media (max-width: 968px) {
  .content-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .page-header h1 {
    font-size: 32px;
  }

  .emprunts-container {
    padding: 20px;
  }
}

@media (max-width: 640px) {
  .form-row {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .card-header {
    padding: 20px;
    flex-direction: column;
    text-align: center;
  }

  .formulaire-emprunt {
    padding: 20px;
  }

  .liste-emprunts {
    padding: 0 20px 20px;
  }

  .emprunt-details {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .emprunt-actions {
    flex-direction: column;
  }

  .page-header h1 {
    font-size: 28px;
  }
}

/* Animation pour suppression */
@keyframes fadeOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(-20px);
  }
}

.emprunt-card.deleting {
  animation: fadeOut 0.3s ease forwards;
}
</style>

<script>
  const API_BASE_URL = "/api/emprunts"; 
  const API_LIVRES_URL = "/api/livres"; 

  let tousLesEmprunts = [];

  // Charger les emprunts
  async function chargerEmprunts() {
    try {
      const response = await fetch(`${API_BASE_URL}/`);

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      const emprunts = await response.json();
      tousLesEmprunts = emprunts;
      afficherEmprunts(emprunts);
      mettreAJourCompteurs(emprunts);
    } catch (error) {
      console.error("Erreur lors du chargement des emprunts:", error);
      document.getElementById("liste-emprunts").innerHTML =
        '<div class="message-vide">⚠️ Erreur lors du chargement des emprunts. Vérifiez que l\'API est accessible.</div>';
      mettreAJourCompteurs([]);
    }
  }

  // Mettre à jour les compteurs
  function mettreAJourCompteurs(emprunts) {
    const enCours = emprunts.filter(e => !e.retourne).length;
    const retournes = emprunts.filter(e => e.retourne).length;
    const compteurElem = document.getElementById("compteur-emprunts");
    
    if (enCours === 0 && retournes === 0) {
      compteurElem.textContent = `Aucun emprunt`;
    } else if (enCours === 0) {
      compteurElem.textContent = `${retournes} emprunt(s) terminé(s)`;
    } else if (retournes === 0) {
      compteurElem.textContent = `${enCours} emprunt(s) en cours`;
    } else {
      compteurElem.textContent = `${enCours} en cours • ${retournes} terminés`;
    }
  }

  // Charger les livres pour le select
  async function chargerLivres() {
    try {
      const response = await fetch(`${API_LIVRES_URL}/`);

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      const livres = await response.json();
      const select = document.getElementById("livre_id");
      const firstOption = select.querySelector("option:first-child");
      select.innerHTML = "";
      select.appendChild(firstOption);

      livres.forEach((livre) => {
        const option = document.createElement("option");
        option.value = livre.id;
        option.textContent = `${livre.titre} - ${livre.auteur_nom || 'Auteur inconnu'}`;
        select.appendChild(option);
      });
    } catch (error) {
      console.error("Erreur lors du chargement des livres:", error);
      const select = document.getElementById("livre_id");
      select.innerHTML = '<option value="">Erreur de chargement des livres</option>';
    }
  }

  // Afficher la liste des emprunts
  function afficherEmprunts(emprunts) {
    const container = document.getElementById("liste-emprunts");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (emprunts.length === 0) {
      container.innerHTML = '<div class="message-vide">📖 Aucun emprunt pour le moment. Commencez par enregistrer un nouveau prêt !</div>';
      return;
    }

    container.innerHTML = emprunts.map((emprunt) => {
      let retardClass = '';
      let statutText = emprunt.retourne ? 'Retourné' : 'En cours';
      let statutClass = emprunt.retourne ? 'retourne' : 'en-cours';
      
      // Vérifier si l'emprunt est en retard
      if (!emprunt.retourne && emprunt.date_retour) {
        const dateRetourPrevue = new Date(emprunt.date_retour);
        if (dateRetourPrevue < today) {
          retardClass = 'retard';
          statutText = 'En retard';
          statutClass = 'retard';
        }
      }

      const dateRetourText = emprunt.date_retour || (emprunt.date_retour_prevue || 'Non spécifiée');
      
      return `
        <div class="emprunt-card ${emprunt.retourne ? 'retourne' : ''} ${retardClass}" data-id="${emprunt.id}">
          <div class="emprunt-info">
            <div class="emprunt-lecteur">
              👤 ${emprunt.nom_lecteur}
            </div>
            <div class="emprunt-livre">
              📚 ${emprunt.livre_titre}
            </div>
            <div class="emprunt-details">
              <p>✍️ <strong>Auteur:</strong> ${emprunt.auteur_nom || 'N/A'}</p>
              <p>📅 <strong>Emprunt:</strong> ${emprunt.date_emprunt}</p>
              <p>⏰ <strong>Retour prévu:</strong> ${dateRetourText}</p>
            </div>
            <div>
              <span class="emprunt-statut ${statutClass}">
                ${statutText === 'En retard' ? '⚠️ ' : ''}${statutText}
              </span>
            </div>
          </div>
          <div class="emprunt-actions">
            ${!emprunt.retourne ? `
              <button class="btn-retourner" onclick="marquerRetourne(${emprunt.id})">
                ✓ Marquer comme retourné
              </button>
            ` : ''}
            <button class="btn-supprimer" onclick="supprimerEmprunt(${emprunt.id})">
              🗑️ Supprimer
            </button>
          </div>
        </div>
      `;
    }).join("");
  }

  // Enregistrer un nouvel emprunt
  async function enregistrerEmprunt(event) {
    event.preventDefault();

    const formData = new FormData(document.getElementById("form-emprunt"));
    const messageDiv = document.getElementById("message-form");
    const submitBtn = document.querySelector(".btn-submit");

    const dateEmprunt = formData.get("date_emprunt") || new Date().toISOString().split("T")[0];

    const donnees = {
      nom_lecteur: formData.get("nom_lecteur"),
      livre_id: parseInt(formData.get("livre_id")),
      date_emprunt: dateEmprunt,
      date_retour: formData.get("date_retour") || null,
      retourne: false,
    };

    if (!donnees.nom_lecteur || !donnees.livre_id) {
      messageDiv.textContent = "Veuillez remplir tous les champs obligatoires";
      messageDiv.className = "erreur";
      return;
    }

    try {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0"></div> Enregistrement...';
      messageDiv.style.display = "block";
      messageDiv.className = "";
      messageDiv.textContent = "Enregistrement en cours...";

      const response = await fetch(`${API_BASE_URL}/creer/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken(),
        },
        body: JSON.stringify(donnees),
      });

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      document.getElementById("form-emprunt").reset();
      document.getElementById("date_emprunt").value = new Date().toISOString().split("T")[0];

      messageDiv.textContent = "✓ Emprunt enregistré avec succès!";
      messageDiv.className = "succes";

      setTimeout(() => {
        chargerEmprunts();
        setTimeout(() => {
          messageDiv.style.display = "none";
        }, 2000);
      }, 500);
    } catch (error) {
      console.error("Erreur lors de l'enregistrement:", error);
      messageDiv.textContent = `✗ Erreur: ${error.message}`;
      messageDiv.className = "erreur";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.66V20H4V4H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 2L22 6M12 12L22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Enregistrer l'emprunt</span>
      `;
    }
  }

  // Marquer un emprunt comme retourné
  async function marquerRetourne(id) {
    const card = document.querySelector(`[data-id="${id}"]`);
    const button = card.querySelector(".btn-retourner");

    try {
      button.disabled = true;
      button.textContent = "⏳ Mise à jour...";

      const today = new Date().toISOString().split("T")[0];

      const response = await fetch(`${API_BASE_URL}/${id}/modifier/`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken(),
        },
        body: JSON.stringify({
          retourne: true,
          date_retour: today,
        }),
      });

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      chargerEmprunts();
    } catch (error) {
      console.error("Erreur lors de la mise à jour:", error);
      alert(`Erreur: ${error.message}`);
      button.disabled = false;
      button.textContent = "✓ Marquer comme retourné";
    }
  }

  // Supprimer un emprunt
  async function supprimerEmprunt(id) {
    const emprunt = tousLesEmprunts.find(e => e.id === id);
    if (!confirm(`Êtes-vous sûr de vouloir supprimer l'emprunt de "${emprunt?.nom_lecteur}" ?`)) {
      return;
    }

    const card = document.querySelector(`[data-id="${id}"]`);
    const button = card.querySelector(".btn-supprimer");

    try {
      button.disabled = true;
      button.classList.add("deleting");
      button.textContent = "🗑️ Suppression...";

      const response = await fetch(`${API_BASE_URL}/${id}/supprimer/`, {
        method: "DELETE",
        headers: {
          "X-CSRFToken": getCSRFToken(),
        },
      });

      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }

      card.classList.add("deleting");
      
      setTimeout(() => {
        chargerEmprunts();
      }, 300);
    } catch (error) {
      console.error("Erreur lors de la suppression:", error);
      alert(`Erreur lors de la suppression: ${error.message}`);
      button.disabled = false;
      button.classList.remove("deleting");
      button.textContent = "🗑️ Supprimer";
    }
  }

  // Récupérer le token CSRF
  function getCSRFToken() {
    let csrfToken = null;
    const cookies = document.cookie.split(";");

    for (let cookie of cookies) {
      const [name, value] = cookie.trim().split("=");
      if (name === "csrftoken") {
        csrfToken = value;
        break;
      }
    }

    return csrfToken;
  }

  // Initialisation
  document.addEventListener("DOMContentLoaded", function () {
    chargerLivres();
    chargerEmprunts();

    document.getElementById("form-emprunt").addEventListener("submit", enregistrerEmprunt);

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date_emprunt").value = today;
  });
</script>
